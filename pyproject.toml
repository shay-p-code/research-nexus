[project]
name = "research-nexus"
version = "0.1.0"
description = "Research that builds on what you already know."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn[standard]==0.53.0",
  "sqlalchemy==2.0.54", "psycopg[binary]==3.3.5", "pgvector==0.5.0",
  "openai==3.14.1", "mcp==1.30.0", "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
